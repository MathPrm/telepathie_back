services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: mathprmt/telepathie-api:latest
    build:
      context: .
      target: production
    ports:
      - "${API_PROD_PORT:-5000}:${PORT}"
    restart: always
    depends_on:
      db:
        condition: service_healthy

  front:
    image: mathprmt/telepathie-front:latest
    build:
      context: ../telepathie_front
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL_PROD}
    ports:
      - "${FRONT_PROD_PORT:-80}:80"
    restart: always
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data: